# Local full-stack override; run after docker-compose.yml. Keeps existing DB credentials.
services:
  api:
    image: company-rag-agent-api:jobs-local
    environment: &local_environment
      BACKGROUND_JOBS_ENABLED: 'true'
      RATE_LIMIT_ENABLED: 'true'
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-rag_worker}:${RABBITMQ_PASSWORD}@rabbitmq:5672/company_rag
      REDIS_URL: redis://redis:6379/0
    ports: !override ['127.0.0.1:8001:8001']
  worker:
    image: company-rag-agent-api:jobs-local
    environment: *local_environment
    init: true
  beat:
    image: company-rag-agent-api:jobs-local
    environment: *local_environment
    init: true
    depends_on:
      rabbitmq:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.3.0
    profiles: ['monitoring']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d']
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./data/monitoring/metrics-token:/run/secrets/metrics-token:ro
      - company_rag_prometheus_data:/prometheus
    ports: ['127.0.0.1:9091:9090']
    restart: unless-stopped
volumes:
  company_rag_prometheus_data:
