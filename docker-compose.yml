services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: company-rag-postgres
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: rag_agent
    ports:
      - "5433:5432"
    volumes:
      - company_rag_pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: company-rag-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://rag_user:rag_password@postgres:5432/rag_agent
      VECTOR_DATABASE_URL: postgresql+psycopg://rag_user:rag_password@postgres:5432/rag_agent
      PLATFORM_ACTION_EXECUTOR_WEBHOOK_URL: ${PLATFORM_ACTION_EXECUTOR_WEBHOOK_URL:-}
      PLATFORM_ACTION_EXECUTOR_API_KEY: ${PLATFORM_ACTION_EXECUTOR_API_KEY:-}
      PLATFORM_ACTION_EXECUTOR_TIMEOUT_SECONDS: ${PLATFORM_ACTION_EXECUTOR_TIMEOUT_SECONDS:-12}
      PLATFORM_ACTION_EXECUTOR_ALLOWED_HOSTS: ${PLATFORM_ACTION_EXECUTOR_ALLOWED_HOSTS:-host.docker.internal}
      PLATFORM_ACTION_EXECUTOR_ALLOWED_SCHEMES: ${PLATFORM_ACTION_EXECUTOR_ALLOWED_SCHEMES:-http,https}
      PLATFORM_ACTION_EXECUTOR_ALLOWED_PORTS: ${PLATFORM_ACTION_EXECUTOR_ALLOWED_PORTS:-443,80,18083,18084,18085}
      PLATFORM_ACTION_EXECUTOR_REQUIRE_ALLOWLIST: ${PLATFORM_ACTION_EXECUTOR_REQUIRE_ALLOWLIST:-true}
      PLATFORM_ACTION_EXECUTION_CALLBACK_SECRET: ${PLATFORM_ACTION_EXECUTION_CALLBACK_SECRET:-local-platform-callback-secret}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  company_rag_pg_data:
